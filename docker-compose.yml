# Synthetic corporate IT sandbox. Nothing here connects to a real system.
# Usage: cp .env.example .env (set local passwords), then `make up`.
name: arl

services:
  ops-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: arl_ops
      POSTGRES_USER: arl_admin
      POSTGRES_PASSWORD: ${OPS_DB_ADMIN_PASSWORD:?set in .env}
      ARL_AGENT_DB_PASSWORD: ${ARL_AGENT_DB_PASSWORD:?set in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - ops-data:/var/lib/postgresql/data
      - ./db/ops:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arl_admin -d arl_ops"]
      interval: 3s
      timeout: 3s
      retries: 20

  app-db:
    image: postgres:16
    container_name: arl-app-db   # fixed name: platform-ops maps the target "app-db" to it
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: ${APP_DB_ADMIN_PASSWORD:?set in .env}
      ORDERS_APP_PASSWORD: ${ORDERS_APP_PASSWORD:?set in .env}
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - app-data:/var/lib/postgresql/data
      - ./db/app:/docker-entrypoint-initdb.d:ro
    restart: "no"   # a stopped database stays stopped until someone (or the agent) restarts it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d orders"]
      interval: 3s
      timeout: 3s
      retries: 20

  orders-api:
    build: .
    command: ["uvicorn", "arl.sim.orders_api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_DATABASE_URL: postgresql://orders_app:${ORDERS_APP_PASSWORD}@app-db:5432/orders
    ports: ["127.0.0.1:8101:8000"]
    depends_on:
      app-db: {condition: service_healthy}
    healthcheck:   # /health is 503 while app-db is down, so this shows "unhealthy" during INC-001
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # The ONLY path from the agent to Docker: agent -> platform-ops -> docker-proxy -> Docker.
  # The proxy forwards container stop/restart/kill and nothing else (POST=1 is needed for
  # those calls; every other write section stays at its default of denied). It has no
  # published port and sits on its own network, so only platform-ops can reach it.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      POST: 1
      ALLOW_RESTARTS: 1
      CONTAINERS: 0
      IMAGES: 0
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      BUILD: 0
      DISABLE_IPV6: 1   # listen on IPv4 only; some Docker hosts have no IPv6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    restart: unless-stopped

  platform-ops:
    build: .
    command: ["uvicorn", "--factory", "arl.services.platform_ops:app_from_env",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PLATFORM_OPS_TOKEN: ${PLATFORM_OPS_TOKEN:?set in .env}
      DOCKER_PROXY_URL: http://docker-proxy:2375
    ports: ["127.0.0.1:8190:8000"]
    networks: [default, docker-api]
    depends_on: [docker-proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  docker-api:
    internal: true   # no route outside Docker; only docker-proxy and platform-ops are on it

volumes:
  ops-data:
  app-data:
