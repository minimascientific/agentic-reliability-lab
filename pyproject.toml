[project]
name = "arl"
version = "0.1.0"
description = "Agentic Reliability Lab: a bounded, auditable incident-response agent (LangGraph + Claude) for a synthetic corporate IT environment."
readme = "README.md"
authors = [
    { name = "Alison Gorman", email = "113557667+minimascientific@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker Compose sandbox running (make up)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F/W: errors, I: imports, B: bugbear, S: bandit security rules, UP: modern syntax
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["UP046"]  # keep typing.Generic: clearer for readers new to PEP 695

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # asserts and fake passwords are fine in tests

[project.scripts]
arl-demo = "arl.cli:main"
